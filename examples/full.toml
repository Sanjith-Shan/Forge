# Exercises every supported peripheral type: GPIO (with and without interrupts),
# an I2C bus with multiple devices, an SPI bus with a device, and two UARTs.
[board]
name = "jupiter_v2"
mcu = "esp32c6"
clock_mhz = 160

[[gpio]]
pin = 13
mode = "output"
label = "status_led"

[[gpio]]
pin = 4
mode = "input_pullup"
label = "user_button"
interrupt = "falling"

[[i2c]]
bus = 0
sda_pin = 21
scl_pin = 22
speed_khz = 400
label = "sensor_bus"

[[i2c.device]]
address = 0x2C
label = "potentiometer"

[[i2c.device]]
address = 0x68
label = "imu"

[[spi]]
bus = 0
mosi_pin = 23
miso_pin = 19
sck_pin = 18
label = "display_bus"

[[spi.device]]
cs_pin = 5
label = "oled"
mode = 0
speed_mhz = 10

[[uart]]
index = 1
tx_pin = 17
rx_pin = 16
baud = 115200
label = "debug_serial"

[[uart]]
index = 2
tx_pin = 25
rx_pin = 26
baud = 9600
label = "gps"
