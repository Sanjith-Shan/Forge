[package]
name = "forge-embedded"
version = "0.1.1"
edition = "2021"
description = "Analyze embedded hardware configs and generate dependency-ordered C initialization code"
license = "MIT"
repository = "https://github.com/Sanjith-Shan/Forge"
readme = "README.md"
keywords = ["embedded", "code-generation", "firmware", "hardware"]
categories = ["development-tools", "embedded"]

# The crate publishes as `forge-embedded` (the name `forge` is taken on
# crates.io), but the installed binary and the importable library are both
# `forge`.
[[bin]]
name = "forge"
path = "src/main.rs"

[lib]
name = "forge"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
reqwest = { version = "0.12", optional = true, default-features = false, features = [
    "json",
    "rustls-tls",
] }
dotenvy = { version = "0.15", optional = true }

[features]
default = []
# Enables the real OpenAI-backed AI frontend (`forge ai`). Without it, the AI
# pipeline still exists and is testable via the mock provider, but the CLI's
# `ai` command is unavailable. `dotenvy` lets the key live in a gitignored .env.
ai = ["dep:reqwest", "dep:dotenvy"]

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"
