[package]
name = "forge-embedded"
version = "0.1.0"
edition = "2021"
description = "Analyze embedded hardware configs and generate dependency-ordered C initialization code"
license = "MIT"
repository = "https://github.com/Sanjith-Shan/Forge"
readme = "README.md"
keywords = ["embedded", "code-generation", "firmware", "hardware"]
categories = ["development-tools", "embedded"]

# The crate publishes as `forge-embedded` (the name `forge` is taken on
# crates.io), but the installed binary and the importable library are both
# `forge`.
[[bin]]
name = "forge"
path = "src/main.rs"

[lib]
name = "forge"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tokio = { version = "1", features = ["full"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"
